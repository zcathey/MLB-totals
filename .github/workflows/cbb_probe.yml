name: CBB probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ESPN coverage
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball
          for q in "groups=50&limit=500" "groups=50&limit=1000" "limit=1000" "groups=50" "groups=50&limit=200&page=2"; do
            n=$(curl -sS -m 30 "$B/scoreboard?dates=20261114&$q" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('events',[])), d.get('leagues',[{}])[0].get('calendarType'))")
            echo "Q[$q] events=$n"
          done
          curl -sS -m 30 "$B/teams/253/schedule?season=2027" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          print('team', d.get('team',{}).get('displayName'))
          for e in d.get('events',[])[:8]:
              c=e['competitions'][0]; print('SCHED', e['date'], e['id'], [x['team']['displayName'] for x in c['competitors']], c['status']['type']['name'])"
          curl -sS -m 30 "$B/scoreboard?dates=20261114&groups=50&limit=500" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          print('IDS', sorted(e['id'] for e in d['events'])[:5])"
